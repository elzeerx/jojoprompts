    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Route-owned metadata: description, canonical, og:*, twitter:*, and
      robots are emitted per-route via <SeoHead /> (react-helmet-async).
      We intentionally do NOT ship duplicate static tags here — that would
      cause competing tags (e.g. two robots directives) after hydration.
      Only a minimal fallback <title> stays for the pre-hydration frame.
    -->
    <title>JojoPrompts</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Add Lovable script tag for enabling new features -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
